name: Cloud Smoke (paid, manual)

# This workflow intentionally has no push/pull_request triggers. It submits one
# minimal, billable MediaKit cloud task and must be started by a human.
on:
  workflow_dispatch:
    inputs:
      confirm_billing:
        description: "确认知悉本次运行会产生真实付费（必须选择 true 才会执行）"
        type: boolean
        required: true
        default: false
      resume_task_id:
        description: "只查询和下载已有 task_id（填写后绝不提交新任务；无需计费确认）"
        required: false
        default: ""
      client_token:
        description: "幂等 token（留空则自动生成；重试同一付费任务时填固定值避免重复计费）"
        required: false
        default: ""
      poll_interval_seconds:
        description: "Polling interval in seconds"
        required: false
        default: "5"
      max_poll_attempts:
        description: "Maximum polling attempts"
        required: false
        default: "60"

# A fixed group serializes paid runs. With cancel-in-progress=false an active
# run is NOT cancelled; another dispatch can wait and later create a new task.
# Concurrency is not a billing quota and does not deduplicate sequential runs.
concurrency:
  group: mediakit-cloud-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paid-cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify required secret exists
        shell: bash
        env:
          MEDIAKIT_API_KEY: ${{ secrets.MEDIAKIT_API_KEY }}
        run: |
          if [ -z "${MEDIAKIT_API_KEY}" ]; then
            echo "::error::Repository secret MEDIAKIT_API_KEY is not configured. Add it under Settings -> Secrets and variables -> Actions before running this paid smoke workflow."
            exit 1
          fi
      - name: Require explicit billing confirmation
        shell: bash
        env:
          CONFIRM_BILLING: ${{ inputs.confirm_billing }}
          SMOKE_RESUME_TASK: ${{ inputs.resume_task_id }}
        run: |
          if [ -z "$SMOKE_RESUME_TASK" ] && [ "$CONFIRM_BILLING" != "true" ]; then
            echo "::error::This workflow submits a real billable MediaKit task. Set 'confirm_billing' to true to proceed."
            exit 1
          fi
      - name: Install ffmpeg and MediaKit CLI
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npx -y @volcengine/mediakit-cli install -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mediakit-cli --version
      - name: Prepare real ComfyUI node runtime
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: fca60fe70e5b84c5c6b058263653d15cb3401e44
          path: .smoke-comfyui
      - name: Install ComfyUI CPU dependencies
        shell: bash
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .smoke-comfyui/requirements.txt
      - name: Run one minimal paid cloud trim task
        shell: bash
        env:
          MEDIAKIT_API_KEY: ${{ secrets.MEDIAKIT_API_KEY }}
          SMOKE_POLL_INTERVAL: ${{ inputs.poll_interval_seconds }}
          SMOKE_MAX_ATTEMPTS: ${{ inputs.max_poll_attempts }}
          SMOKE_CLIENT_TOKEN: ${{ inputs.client_token }}
          SMOKE_RESUME_TASK: ${{ inputs.resume_task_id }}
        run: |
          python -m unittest discover -s tests -q
          python scripts/verify_paid_smoke_contract.py --comfy-root ./.smoke-comfyui
          if [ -n "$SMOKE_RESUME_TASK" ]; then
            python scripts/cloud_smoke.py \
              --resume-task-id "$SMOKE_RESUME_TASK" \
              --comfy-root ./.smoke-comfyui \
              --work-dir ./cloud-smoke-artifacts \
              --poll-interval-seconds "$SMOKE_POLL_INTERVAL" \
              --max-poll-attempts "$SMOKE_MAX_ATTEMPTS"
          else
            python scripts/cloud_smoke.py \
              --confirm-billing \
              --comfy-root ./.smoke-comfyui \
              --work-dir ./cloud-smoke-artifacts \
              --duration-seconds 2 \
              --poll-interval-seconds "$SMOKE_POLL_INTERVAL" \
              --max-poll-attempts "$SMOKE_MAX_ATTEMPTS" \
              --client-token "$SMOKE_CLIENT_TOKEN"
          fi
      - name: Upload smoke report and synthetic media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediakit-cloud-smoke-${{ github.run_id }}
          path: cloud-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
