name: Publish to Comfy Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse placeholder Registry metadata
        shell: bash
        run: |
          if grep -Eq 'OWNER|replace-before-publish' pyproject.toml; then
            echo 'Replace GitHub and PublisherId placeholders before publishing.'
            exit 1
          fi
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

